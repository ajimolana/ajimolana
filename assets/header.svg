    <rect width="1200" height="340" fill="#0D1117"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#fff" stroke-opacity="0.045"/><line x1="0" y1="90" x2="1200" y2="90" stroke="#fff" stroke-opacity="0.045"/><line x1="0" y1="140" x2="1200" y2="140" stroke="#fff" stroke-opacity="0.045"/><line x1="0" y1="190" x2="1200" y2="190" stroke="#fff" stroke-opacity="0.045"/><line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-opacity="0.045"/><line x1="0" y1="290" x2="1200" y2="290" stroke="#fff" stroke-opacity="0.045"/><line x1="100" y1="0" x2="100" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="200" y1="0" x2="200" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="300" y1="0" x2="300" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="400" y1="0" x2="400" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="500" y1="0" x2="500" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="600" y1="0" x2="600" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="700" y1="0" x2="700" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="800" y1="0" x2="800" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="900" y1="0" x2="900" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="1000" y1="0" x2="1000" y2="340" stroke="#fff" stroke-opacity="0.025"/><line x1="1100" y1="0" x2="1100" y2="340" stroke="#fff" stroke-opacity="0.025"/>
