    <g mask="url(#fcMask)">
      <path class="breathe" d="M900.0 269.0 L905.4 267.7 L910.9 266.5 L916.7 265.2 L922.7 263.9 L928.9 262.5 L935.2 261.2 L941.8 259.8 L948.5 258.4 L955.3 257.0 L962.3 255.6 L969.5 254.2 L976.8 252.7 L984.2 251.3 L991.7 249.9 L999.3 248.4 L1007.0 246.9 L1014.9 245.5 L1022.7 244.0 L1030.7 242.5 L1038.8 241.0 L1046.8 239.6 L1055.0 238.1 L1063.2 236.6 L1071.4 235.1 L1079.6 233.7 L1087.8 232.2 L1096.1 230.8 L1104.3 229.3 L1112.6 227.9 L1120.8 226.5 L1129.0 225.0 L1137.1 223.6 L1145.2 222.2 L1153.3 220.9 L1161.3 219.5 L1169.2 218.2 L1177.0 216.8 L1184.8 215.5 L1192.4 214.3 L1200.0 213.0 L1200.0 265.0 L1192.4 265.0 L1184.8 264.9 L1177.0 264.9 L1169.2 264.8 L1161.3 264.8 L1153.3 264.8 L1145.2 264.8 L1137.1 264.7 L1129.0 264.7 L1120.8 264.7 L1112.6 264.7 L1104.3 264.7 L1096.1 264.7 L1087.8 264.8 L1079.6 264.8 L1071.4 264.8 L1063.2 264.9 L1055.0 264.9 L1046.8 265.0 L1038.8 265.1 L1030.7 265.2 L1022.7 265.3 L1014.9 265.4 L1007.0 265.5 L999.3 265.6 L991.7 265.7 L984.2 265.9 L976.8 266.1 L969.5 266.2 L962.3 266.4 L955.3 266.6 L948.5 266.8 L941.8 267.0 L935.2 267.3 L928.9 267.5 L922.7 267.8 L916.7 268.1 L910.9 268.4 L905.4 268.7 L900.0 269.0 Z" fill="url(#bandGrad)"/>
      <path class="flow" d="M900 269 C970 258.5 1100 247 1200 239" fill="none" stroke="#4A9AF5" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
      <circle cx="999.3" cy="257.0" r="3.5" fill="#0D1117" stroke="#4A9AF5" stroke-width="2"/><circle cx="1096.1" cy="247.8" r="3.5" fill="#0D1117" stroke="#4A9AF5" stroke-width="2"/>
    </g>
    <path class="draw" pathLength="1" d="M0 318 L100 310 L200 315 L300 299 L400 304 L500 289 L600 295 L700 278 L800 284 L900 269" fill="none" stroke="#E6EDF3" stroke-width="6" stroke-opacity="0.18" stroke-linejoin="round" filter="url(#glow)"/>
    <path class="draw" pathLength="1" d="M0 318 L100 310 L200 315 L300 299 L400 304 L500 289 L600 295 L700 278 L800 284 L900 269" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <g opacity="0">
      <circle r="8" fill="#4A9AF5" fill-opacity="0.45" filter="url(#dotGlow)"/>
      <circle r="2.6" fill="#BFDBFE"/>
      <animateMotion path="M900 269 C970 258.5 1100 247 1200 239" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.5 0 0.8 1" dur="3.5s" begin="3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="3.5s" begin="3.3s" repeatCount="indefinite"/>
    </g>
    <circle class="pulse" cx="900" cy="269" r="5.5" fill="none" stroke="#4A9AF5" stroke-width="2"/>
    <circle class="p1" cx="100" cy="310" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p2" cx="200" cy="315" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p3" cx="300" cy="299" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p4" cx="400" cy="304" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p5" cx="500" cy="289" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p6" cx="600" cy="295" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p7" cx="700" cy="278" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p8" cx="800" cy="284" r="4.5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.5"/><circle class="p9" cx="900" cy="269" r="5.5" fill="#0D1117" stroke="#4A9AF5" stroke-width="2.5"/>
    <rect width="1200" height="340" fill="url(#vignette)"/>
  </g>
  <text class="sans fade-in d1" x="600" y="140" text-anchor="middle" dominant-baseline="middle" font-size="86" font-weight="700" letter-spacing="10" fill="#ffffff">MAULANA RAJI</text>
  <text class="sans fade-in d2" x="600" y="210" text-anchor="middle" dominant-baseline="middle" font-size="26" font-weight="500" letter-spacing="1" fill="#8b8b8b">Actuarial &amp; Data Science</text>
</svg>
