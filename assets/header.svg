<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Maulana Raji. Actuarial and Data Science.">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B949E"/><stop offset="1" stop-color="#E6EDF3"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="239" x2="0" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0.09"/><stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="900" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A9AF5" stop-opacity="0.24"/><stop offset="1" stop-color="#4A9AF5" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0.55" stop-color="#0D1117" stop-opacity="0"/><stop offset="1" stop-color="#0D1117" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4"/></filter>
    <mask id="fcMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="340">
      <path class="drawfc" pathLength="1" d="M900 269 C970 258.5 1100 247 1200 239" fill="none" stroke="#fff" stroke-width="90"/>
    </mask>
    <clipPath id="areaSweep" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="0" height="340">
        <animate attributeName="width" values="0;900;1200" keyTimes="0;0.6667;1" dur="3s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
@font-face {
  font-family: 'Poppins';
  font-style: normal;
  font-weight: 700;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
@font-face {
  font-family: 'Poppins';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
      .sans { font-family: 'Poppins', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .fade-in { animation: up 0.9s ease-out both; }
      .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.45s; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .draw { stroke-dasharray: 1; animation: draw 2.0s linear 0.3s both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      .drawfc { stroke-dasharray: 1; animation: draw 1.0s linear 2.3s both; }
      @keyframes show { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
      .pulse { transform-box: fill-box; transform-origin: center; opacity: 0;
                animation: pulse 3.5s ease-out 3.3s infinite backwards; }
      .flow { animation: flow 1.4s linear 3.3s infinite; }
      @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -13; } }
      .breathe { animation: breathe 3.5s ease-in-out 3.3s infinite backwards; }
      @keyframes breathe { 0%, 100% { opacity: .5; } 40% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow, .breathe { animation: none; } }
      @keyframes pulse { 0% { opacity: 0; transform: scale(1); } 15% { opacity: .65; transform: scale(1.5); } 100% { opacity: 0; transform: scale(3.4); } }
      .p1{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 0.52s both}.p2{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 0.74s both}.p3{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 0.97s both}.p4{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 1.19s both}.p5{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 1.41s both}.p6{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 1.63s both}.p7{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 1.86s both}.p8{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 2.08s both}.p9{transform-box:fill-box;transform-origin:center;animation:pop .25s ease-out 2.30s both}
    </style>
  </defs>
